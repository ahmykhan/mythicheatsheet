name: Auto-Build FAST Timetable

on:
  push:
    paths:
      - '**.xlsx' # Triggers only when you upload a new Excel file

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenPyXL
        run: pip install openpyxl

      - name: Run Updater Script
        run: python update_site.py

      - name: Commit and Push Updated data.js
        run: |
          git config --global user.name "FAST Timetable Bot"
          git config --global user.email "bot@mythicheatsheet.netlify.app"
          git add data.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update timetable data [skip ci]"
          git push